<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Zero | Register</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-left">

            <div class="logo">PZ</div>

            <h1>Patient Zero</h1>

            <p class="tagline">
                The Missing Context
            </p>

            <p class="description">
                Create your personal account and keep your
                medical information organized in one place.
            </p>

        </div>


        <div class="login-card">

            <h2>Create Account</h2>

            <p>
                Enter your details to create your Patient Zero account.
            </p>


            <form id="registerForm">

                <label>Full Name</label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >


                <label>Date of Birth</label>

                <input
                    type="date"
                    id="registerDob"
                    required
                >


                <label>Gender</label>

                <select id="registerGender" required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Other">
                        Other
                    </option>

                    <option value="Prefer not to say">
                        Prefer not to say
                    </option>

                </select>


                <button type="submit">
                    Create Account →
                </button>


                <p id="registerMessage"></p>

            </form>


            <div class="register-link">

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script src="szcript.js"></script>

</body>

</html>
